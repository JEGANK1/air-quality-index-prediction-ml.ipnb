<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQI Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AQI Prediction</h1>
        <div class="result">
            <h2 id="result">Loading...</h2>
        </div>
    </div>
    <script>
        async function getPrediction() {
            const response = await fetch('/predict');
            const result = await response.json();
            document.getElementById('result').innerHTML = `Predicted AQI: ${result.AQI.toFixed(2)} - ${result.Category}`;
        }

        window.onload = getPrediction;
    </script>
</body>
</html>
